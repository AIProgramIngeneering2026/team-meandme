[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meandme"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "Pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
